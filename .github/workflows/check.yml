name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      # The window is built before anything that compiles the binary. It is
      # not committed — see ui/.gitignore — so without this the binary
      # carries the .keep file and nothing else, `orbit web` refuses, and
      # the goldens that draw the browser's half have nothing to draw.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui

      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
      - run: go test ./...
      - run: go mod tidy -diff

      # install.sh is how everybody who is not building from source gets
      # orbit, and it has a test suite that until now nothing ran. A change to
      # the os/arch mapping or the asset name is a change nobody notices until
      # somebody's install prints a 404.
      - run: bash install_test.sh

      # And .goreleaser.yml is only read during a release, which is the worst
      # place to find out it does not parse: the tag has been pushed by then.
      # The same v2 pin release.yml uses, for the same reason.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check

  # The flows the landing shows, walked end to end: the real binary against a
  # real git repository with a real Go module in it, real gates running real
  # commands, and a stand-in engine on PATH under the name the flows ask for.
  # Only the model is faked.
  #
  # A job of its own, and on both the systems a release ships for. It is
  # slower than the rest, and a break that only happens on Linux is a break
  # nobody sees on the machine this was written on.
  #
  # release.yml waits on this whole workflow's conclusion, so a red run here
  # holds the release back without either file naming the other.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      # The window is built before anything that compiles the binary. It is
      # not committed — see ui/.gitignore — so without this the binary
      # carries the .keep file and nothing else, `orbit web` refuses, and
      # the goldens that draw the browser's half have nothing to draw.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui

      - run: make integration
