name: release

# Released when somebody says so, and never by merging.
#
# It ran on every green check on main, so a pull request landing was also a
# release: whoever ran `orbit upgrade` that afternoon got whatever had just
# been merged, including the halves of a thing still being built. Merging is
# a decision about main and releasing is a decision about everybody else,
# and they are not the same decision.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version moves"
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: write

# One release at a time. Both jobs push — a tag and then the assets under it —
# and two runs overlapping would have the second computing its next version
# from a tag the first had not pushed yet, so both would pick the same one and
# one of the two pushes would fail after the other had already released. A
# queued run is not cancelled: somebody asked for each of these by hand, and
# cancelling one would be throwing away a release they meant to cut.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    # A dispatch is offered on any branch the workflow file exists on, and
    # this job tags what it is given and publishes it as a release.
    # Dispatched from a feature branch it would cut a version tag off that
    # branch, which is a release nobody could get back.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Which part moves is the dispatcher's to choose. It was always the
      # patch, so the first v0.2.0 would have been a tag pushed by hand —
      # and a version pushed by hand is one the next run of this computes
      # from and gets wrong.
      - name: Compute next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v${major}.$((minor + 1)).0" ;;
              *)     next="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"

      - name: Tag it
        run: |
          git config user.name "orbit-release"
          git config user.email "actions@github.com"
          git tag -a "${{ steps.next.outputs.version }}" -m "${{ steps.next.outputs.version }}"
          git push origin "${{ steps.next.outputs.version }}"

  release:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.version }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      # The window is built before anything that compiles the binary. It is
      # not committed — see ui/.gitignore — so without this the binary
      # carries the .keep file and nothing else, `orbit web` refuses, and
      # the goldens that draw the browser's half have nothing to draw.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: make ui

      # Pinned to the v2 line rather than latest: goreleaser's next major is
      # a different configuration language, and `latest` would meet it on
      # whichever release happened to run that day — with no change of ours to
      # point at.
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
