version: 2

project_name: orbit

builds:
  - id: orbit
    main: ./cmd/orbit
    binary: orbit
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/e1i0r/orbit/internal/cli.Version={{ .Version }}

archives:
  - id: orbit
    ids:
      - orbit
    formats:
      - tar.gz
    name_template: "orbit_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
